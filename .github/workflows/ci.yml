name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/shahzaibroyalacademy
          JWT_SECRET: ci-only-placeholder-signing-key
          JWT_REFRESH_SECRET: ci-only-placeholder-refresh-key
          NEXT_PUBLIC_SITE_URL: https://example.invalid
